name: CI

# Checks pull requests; pushes to main are checked and deployed by deploy.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
